services:
  frontend:
    build:
      context: ./web/front-ccd
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./web/front-ccd:/app
      - front_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend

  backend:
    build:
      context: ./web/back-ccd
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ./web/back-ccd:/app
      - back_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db

volumes:
  front_node_modules:
  back_node_modules:
  postgres_data:
