services:
  frontend:
    build:
      context: ./web/front-ccd
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./web/front-ccd:/app
      - front_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend

  backend:
    build:
      context: ./web/back-ccd
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ./web/back-ccd:/app
      - back_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  backend2:
    build:
      context: ./web/back-ccd
      dockerfile: Dockerfile
    volumes:
      - ./web/back-ccd:/app
      - back_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db

  lb:
    image: nginx:stable-alpine
    ports:
      - "${LB_PORT}:80"
    volumes:
      - ./web/lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - backend2

volumes:
  front_node_modules:
  back_node_modules:
  postgres_data:
