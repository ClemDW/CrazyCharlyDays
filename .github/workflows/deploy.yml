name: Déploiement docketu v4


on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: fetch le code
        uses: actions/checkout@v4

      - name: clone/update docketu
        env:
          SSH_USER: ${{ secrets.DOCKETU_SSH_USER }}
          SSH_HOST: ${{ secrets.DOCKETU_SSH_HOST }}
          SSH_KEY: ${{ secrets.DOCKETU_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" '
            cd /users/home/denis154u || mkdir -p /users/home/denis154u
            if [ -d "ccd/.git" ]; then
              cd ccd
              git pull
            else
              git clone git@github.com:ClemDW/CrazyCharlyDays.git ccd
            fi
          '
