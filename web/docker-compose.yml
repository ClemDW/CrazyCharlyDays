services:
  frontend:
    build:
      context: ./front-ccd
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./front-ccd:/app
      - front_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./back-ccd
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./back-ccd:/app
      - back_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=development

volumes:
  front_node_modules:
  back_node_modules:
